services:
  postgres:
    image: postgres:16-alpine
    container_name: webkultura-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: webkultura
      POSTGRES_PASSWORD: webkultura
      POSTGRES_DB: webkultura
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: webkultura-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://webkultura:webkultura@postgres:5432/webkultura?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: webkultura-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://${API_HOST:-localhost}:4000
      API_URL: http://api:4000
      NODE_ENV: production
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
