server {
    listen 80;
    server_name new.web-kultura.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name new.web-kultura.ru;

    ssl_certificate /etc/letsencrypt/live/new.web-kultura.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.web-kultura.ru/privkey.pem;

    client_max_body_size 50M;

    # API backend
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files
    location /uploads/ {
        proxy_pass http://api:4000/uploads/;
    }

    # Next.js frontend
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
